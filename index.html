<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ソフトテニスノート</title>
<script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
<script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
<style>
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;background:#16223a;color:#eef3f9;font-family:Arial,"Noto Sans JP",sans-serif}
button,input{font:inherit}
.hidden{display:none!important}
.login{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px}
.login-card{width:min(360px,100%);background:#1f2f47;border:1px solid #31445e;border-radius:12px;padding:28px}
.login-card h1{text-align:center;font-size:20px;margin:0 0 20px}
.login-card input{width:100%;padding:11px;border-radius:7px;border:1px solid #31445e;background:#16223a;color:#eef3f9;outline:none}
.login-card button{width:100%;margin-top:10px;padding:11px;border:0;border-radius:7px;background:#ffd166;color:#16223a;font-weight:700;cursor:pointer}
.error{text-align:center;color:#ff8787;font-size:12px;margin:10px 0 0}
header{border-bottom:1px solid #31445e;background:#16223a}
.nav{max-width:1000px;margin:auto;padding:14px 18px;display:flex;align-items:center;justify-content:space-between}
.brand{font-weight:700}
.logout{background:#1f2f47;color:#c9d6e3;border:1px solid #31445e;border-radius:7px;padding:7px 11px;cursor:pointer}
main{max-width:1000px;margin:auto;padding:30px 18px}
.home-title{margin:0 0 8px;font-size:26px}
.home-sub{margin:0 0 24px;color:#93a9c2;font-size:14px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:14px}
.card{background:#1f2f47;border:1px solid #31445e;border-radius:12px;padding:20px;cursor:pointer;text-decoration:none;color:inherit;display:block}
.card:hover{border-color:#607796}
.card h2{font-size:17px;margin:0 0 8px}
.card p{font-size:13px;line-height:1.6;color:#93a9c2;margin:0}
.page{display:none}.page.active{display:block}
.back{background:none;border:0;color:#ffd166;padding:0;margin:0 0 18px;cursor:pointer}
@media(max-width:600px){main{padding:22px 12px}.home-title{font-size:22px}}
</style>
</head>
<body>

<section id="login" class="login">
  <div class="login-card">
    <h1>ソフトテニスノート</h1>
    <form id="loginForm">
      <input id="password" type="password" placeholder="パスワード" autocomplete="current-password">
      <button type="submit">入室</button>
      <p id="error" class="error hidden">パスワードが違います</p>
    </form>
  </div>
</section>

<div id="site" class="hidden">
<header>
  <div class="nav">
    <div class="brand">ソフトテニスノート</div>
    <button class="logout" id="logout">退出</button>
  </div>
</header>

<main>
  <section id="homePage" class="page active">
    <h1 class="home-title">ソフトテニスノート</h1>
    <p class="home-sub">シミュレーターや資料をまとめています。</p>
    <div class="grid">
      <a class="card" href="positioning.html">
        <h2>前衛ポジショニング</h2>
        <p>コート上の前衛の位置をシミュレーションします。</p>
      </a>
      <a class="card" href="scoreing.html">
        <h2>スコアボード</h2>
        <p>ゲームで使うスコアボードです。</p>
      </a>
      <a class="card" href="tournament.html">
        <h2>トーナメント</h2>
        <p>トーナメントを作成します。</p>
      </a>
       <a class="card" href="tactics.html">
        <h2>作戦ボード</h2>
        <p>戦術の考え方をまとめます。</p>
      </a>
      <a class="card" href="practice.html">
        <h2>練習メニュー</h2>
        <p>練習方法や目的をまとめます。</p>
      </a>
       <a class="card" href="timer.html">
        <h2>タイマー</h2>
        <p>時間確認できます。</p>
      </a>
      <a class="card" href="resorces">
        <h2>資料</h2>
        <p>資料やメモをまとめます。</p>
      </a>
    </div>
  </section>

  <section id="simulatorPage" class="page">
    <button class="back" data-page="home">← 戻る</button>
    <div id="simulatorRoot"></div>
  </section>
  
</main>
</div>

<script>
const SITE_PASSWORD="gktennis017951";
const login=document.getElementById("login");
const site=document.getElementById("site");
const error=document.getElementById("error");

function openSite(){login.classList.add("hidden");site.classList.remove("hidden");}

document.getElementById("loginForm").addEventListener("submit",e=>{
  e.preventDefault();
  if(document.getElementById("password").value===SITE_PASSWORD){
    sessionStorage.setItem("stp_authed","1");
    error.classList.add("hidden");
    openSite();
  }else error.classList.remove("hidden");
});

function showPage(name){
  document.querySelectorAll(".page").forEach(p=>p.classList.remove("active"));
  const el = document.getElementById(name+"Page");
  if (el) { el.classList.add("active"); window.scrollTo(0,0); }
}

document.querySelectorAll("[data-page]").forEach(el=>{
  el.addEventListener("click",()=>showPage(el.dataset.page));
});

document.getElementById("logout").addEventListener("click",()=>{
  sessionStorage.removeItem("stp_authed");
  location.reload();
});

if(sessionStorage.getItem("stp_authed")==="1") openSite();
</script>

<script type="text/babel" src="soft-tennis-positioning.jsx"></script>

</body>
</html>
